name: Refresh profile cards

# Rebuilds assets/generated/*.svg and the "latest" section of the README from live GitHub and PyPI data.
on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/**", ".github/workflows/cards.yml"]

permissions:
  contents: write

jobs:
  cards:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the cards
        run: python scripts/cards.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit when something changed
        run: |
          git config user.name "thibautdqb"
          git config user.email "thibautdqb@gmail.com"
          git add assets/generated
          git diff --cached --quiet && echo "nothing new" && exit 0
          git commit -m "Refresh profile cards"
          git push
