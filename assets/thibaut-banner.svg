<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" role="img" aria-labelledby="title desc" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <title id="title">Thibautdqb — animated T-Rex runner banner</title>
  <desc id="desc">A polished pixel T-Rex runs and jumps over a cactus on a dark gradient track, with name and tagline, for Thibaut de Quatrebarbes.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0"    stop-color="#070c14"/>
      <stop offset="0.45" stop-color="#141026"/>
      <stop offset="0.8"  stop-color="#2a1638"/>
      <stop offset="1"    stop-color="#0d1119"/>
    </linearGradient>
    <radialGradient id="moon" cx="50%" cy="50%" r="50%">
      <stop offset="0"    stop-color="#ffe4bf" stop-opacity="0.95"/>
      <stop offset="0.45" stop-color="#ff9f6b" stop-opacity="0.55"/>
      <stop offset="0.8"  stop-color="#bb9cff" stop-opacity="0.12"/>
      <stop offset="1"    stop-color="#bb9cff" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="frame"><rect width="1200" height="260" rx="18"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <!-- backdrop -->
    <rect width="1200" height="260" fill="url(#bg)"/>

    <!-- faint grid -->
    <g stroke="#79f4b0" stroke-width="1" opacity="0.06">
      <path d="M0 44H1200M0 88H1200M0 132H1200M0 176H1200"/>
      <path d="M120 0V260M240 0V260M360 0V260M480 0V260M600 0V260M720 0V260M840 0V260M960 0V260M1080 0V260"/>
    </g>

    <!-- glow / moon -->
    <circle cx="965" cy="86" r="88" fill="url(#moon)" filter="url(#glow)"/>

    <!-- twinkling stars -->
    <g fill="#c4ffe3" opacity="0.5">
      <circle cx="120" cy="40" r="1.4"/><circle cx="300" cy="26" r="1"/><circle cx="520" cy="46" r="1.2"/>
      <circle cx="700" cy="28" r="1"/><circle cx="1080" cy="34" r="1"/>
      <animate attributeName="opacity" values="0.5;0.15;0.5" dur="4s" repeatCount="indefinite"/>
    </g>

    <!-- pterodactyl gliding across the sky -->
    <g fill="#bb9cff" opacity="0.85" filter="url(#glow)">
      <g transform="translate(0 34)">
        <rect x="18" y="6" width="16" height="7" rx="2"/>
        <rect x="30" y="3" width="8"  height="6" rx="2"/>
        <g>
          <rect x="0"  y="0"  width="20" height="6" rx="2"/>
          <rect x="34" y="0"  width="20" height="6" rx="2"/>
          <animate attributeName="opacity" values="1;0" dur="0.6s" calcMode="discrete" keyTimes="0;0.5" repeatCount="indefinite"/>
        </g>
        <g>
          <rect x="4"  y="10" width="16" height="6" rx="2"/>
          <rect x="34" y="10" width="16" height="6" rx="2"/>
          <animate attributeName="opacity" values="0;1" dur="0.6s" calcMode="discrete" keyTimes="0;0.5" repeatCount="indefinite"/>
        </g>
      </g>
      <animateTransform attributeName="transform" type="translate" values="1320 0;-160 0" dur="11s" repeatCount="indefinite"/>
    </g>

    <!-- headline -->
    <text x="44" y="92"  fill="#f7f9fc" font-size="26" font-weight="700" letter-spacing="0.5">THIBAUT DE QUATREBARBES</text>
    <text x="46" y="122" fill="#79f4b0" font-size="13.5" letter-spacing="2.4">APPLIED&#160;AI&#160;&#183;&#160;QUANT&#160;RESEARCH&#160;&#183;&#160;DATA&#160;SYSTEMS</text>
    <g font-size="13" fill="#aeb7c4">
      <text x="46" y="146">&gt; building useful systems</text>
      <rect x="222" y="136" width="8" height="12" fill="#79f4b0">
        <animate attributeName="opacity" values="1;1;0;0" dur="1.06s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- ground -->
    <line x1="0" y1="210" x2="1200" y2="210" stroke="#e8eef2" stroke-width="3" opacity="0.95"/>
    <path d="M0 222H1200" stroke="#79f4b0" stroke-width="3" stroke-dasharray="26 14" opacity="0.4">
      <animate attributeName="stroke-dashoffset" from="0" to="-80" dur="0.5s" repeatCount="indefinite"/>
    </path>
    <g fill="#3a4a5a">
      <g>
        <rect x="80" y="216" width="6" height="3"/><rect x="360" y="216" width="4" height="3"/>
        <rect x="640" y="216" width="7" height="3"/><rect x="900" y="216" width="5" height="3"/>
        <rect x="1140" y="216" width="6" height="3"/>
        <animateTransform attributeName="transform" type="translate" values="0 0;-380 0" dur="2.4s" repeatCount="indefinite"/>
      </g>
    </g>

    <!-- cactus (one per loop, jumped over) -->
    <g fill="#46b98a" filter="url(#glow)">
      <g transform="translate(0 166)">
        <rect x="14" y="4"  width="10" height="40" rx="2"/>
        <rect x="4"  y="18" width="10" height="8"  rx="2"/>
        <rect x="4"  y="10" width="7"  height="16" rx="2"/>
        <rect x="24" y="24" width="10" height="8"  rx="2"/>
        <rect x="27" y="14" width="7"  height="18" rx="2"/>
      </g>
      <animateTransform attributeName="transform" type="translate" values="1260 0;-120 0" dur="5s" repeatCount="indefinite"/>
    </g>

    <!-- ===== T-Rex ===== -->
    <g transform="translate(150 136)">
      <!-- ground shadow (stays down, fades when airborne) -->
      <ellipse cx="62" cy="74" fill="#000">
        <animate attributeName="rx" values="34;34;20;34;34" keyTimes="0;0.66;0.78;0.9;1" dur="5s" repeatCount="indefinite"/>
        <animate attributeName="ry" values="4;4;3;4;4"     keyTimes="0;0.66;0.78;0.9;1" dur="5s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.3;0.3;0.08;0.3;0.3" keyTimes="0;0.66;0.78;0.9;1" dur="5s" repeatCount="indefinite"/>
      </ellipse>

      <!-- jump -->
      <g>
        <animateTransform attributeName="transform" type="translate"
          values="0 0;0 0;0 -54;0 0;0 0"
          keyTimes="0;0.66;0.78;0.9;1"
          calcMode="spline"
          keySplines="0 0 1 1;0.25 0 0.3 1;0.5 0 0.7 1;0 0 1 1"
          dur="5s" repeatCount="indefinite"/>

        <!-- body -->
        <g filter="url(#glow)">
          <g fill="#79f4b0">
            <rect x="0" y="39" width="7" height="5"/><rect x="6" y="33" width="9" height="7"/>
            <rect x="13" y="27" width="11" height="8"/><rect x="23" y="22" width="12" height="10"/>
            <rect x="34" y="18" width="13" height="9"/><rect x="38" y="18" width="46" height="34"/>
            <rect x="54" y="11" width="18" height="11"/><rect x="72" y="14" width="12" height="14"/>
            <rect x="82" y="9" width="13" height="22"/><rect x="92" y="2" width="34" height="25"/>
            <rect x="121" y="12" width="8" height="8"/><rect x="108" y="19" width="18" height="7"/>
            <rect x="76" y="33" width="13" height="6"/><rect x="86" y="38" width="6" height="5"/>
          </g>
          <g fill="#52d591">
            <rect x="44" y="30" width="28" height="13"/><rect x="55" y="22" width="16" height="8"/>
            <rect x="82" y="14" width="8" height="13"/><rect x="93" y="12" width="16" height="8"/>
          </g>
          <g fill="#c4ffe3">
            <rect x="45" y="14" width="18" height="5"/><rect x="95" y="5" width="13" height="4"/>
          </g>
          <rect x="96" y="18" width="13" height="7" fill="#19152d"/>
          <rect x="113" y="9" width="4" height="4" fill="#060b12"/>
          <rect x="103" y="19" width="6" height="4" fill="#ffe3be" opacity="0.9"/>
        </g>

        <!-- legs: two frames alternating -->
        <g fill="#79f4b0">
          <g>
            <animate attributeName="opacity" values="1;0" keyTimes="0;0.5" calcMode="discrete" dur="0.26s" repeatCount="indefinite"/>
            <rect x="47" y="51" width="10" height="11"/><rect x="44" y="61" width="22" height="5"/>
            <rect x="68" y="48" width="10" height="23"/><rect x="65" y="69" width="21" height="5"/>
          </g>
          <g>
            <animate attributeName="opacity" values="0;1" keyTimes="0;0.5" calcMode="discrete" dur="0.26s" repeatCount="indefinite"/>
            <rect x="47" y="48" width="10" height="23"/><rect x="52" y="69" width="21" height="5"/>
            <rect x="68" y="51" width="10" height="11"/><rect x="63" y="61" width="22" height="5"/>
          </g>
        </g>
      </g>
    </g>

    <!-- corner tag -->
    <text x="1168" y="200" text-anchor="end" fill="#79f4b0" font-size="12" letter-spacing="1" opacity="0.8">thibautdqb</text>

    <!-- border -->
    <rect x="0.5" y="0.5" width="1199" height="259" rx="18" fill="none" stroke="#79f4b0" stroke-opacity="0.2"/>
  </g>
</svg>
